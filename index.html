<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenOffer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo {
      font-size: 64px;
      font-weight: 900;
      color: #f5b82e;
      margin-bottom: 10px;
    }

    .name {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .name span {
      color: #f5b82e;
    }

    .tagline {
      color: #ddd;
      font-size: 16px;
      margin-bottom: 55px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    .login {
      background: #f5b82e;
      color: #050505;
    }

    .signup {
      background: transparent;
      color: white;
      border: 1px solid #f5b82e;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">Z</div>

    <div class="name">
      Zen<span>Offer</span>
    </div>

    <div class="tagline">
      Speedy Deals, Happy Feels
    </div>

    <button class="btn login" onclick="login()">
      Login
    </button>

    <button class="btn signup" onclick="signup()">
      Sign Up
    </button>

    <div class="footer">
      Offers • Wholesale • Bulk Orders
    </div>

  </div>

  <script>
    function login() {
      alert("ZenOffer Login");
    }

    function signup() {
      alert("ZenOffer Sign Up");
    }
  </script>

</body>
</html>
